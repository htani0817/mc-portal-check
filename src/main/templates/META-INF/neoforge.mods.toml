license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="TANI"
description='''
ネザーゲートを建てる前に、近くの既存ゲートと干渉しないかを調べて画面の右端に出す。
黒曜石・火打石と打ち金・ファイヤーチャージを持っている間と、ゲートに火を付けた直後に表示する。
サーバーとクライアントの両方に入れて使う。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
